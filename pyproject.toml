[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashvault"
dynamic = ["version"]
description = "File-integrity verification and monitoring CLI using cryptographic hashing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["integrity", "hashing", "checksum", "security", "cli", "tamper-detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.scripts]
hashvault = "hashvault.cli:main"

[project.urls]
Homepage = "https://github.com/pashvithareddy-debug/HashVault"

[tool.setuptools.dynamic]
version = { attr = "hashvault.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hashvault = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["hashvault"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/hashvault"]
